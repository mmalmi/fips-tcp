[package]
name = "nvpn-fips-tcp-endpoint"
version = "0.2.41"
description = "FIPS endpoint adapter for TCP/FIPS streams"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "fips_tcp_endpoint"

[dependencies]
nvpn-fips-core = { version = "=0.4.106" }
nvpn-fips-tcp = { version = "0.2.6", path = "../fips-tcp" }
secp256k1 = { version = "0.30", features = ["global-context"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
